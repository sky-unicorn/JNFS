# DataNode 数据存储节点配置
# 负责实际文件块的读写，启动时向 Registry 注册并维持心跳。

# --- RPC 服务 ---
server:
  port: 5369
  # 对外广播 IP 地址（默认自动获取本机 IP，多网卡/云服务器建议手动指定）
  advertised_host: 127.0.0.1
  # 节点唯一标识（不配置则自动生成 UUID 并持久化到 node_id.dat）
  # 生产环境建议手动指定，确保 IP 变更后节点身份不变
  # node_id: "dn-beijing-01"

# --- 存储路径 ---
# 支持配置多个存储路径（磁盘挂载点），DataNode 自动选择剩余空间最大的路径写入。
storage:
  paths:
    - D:/data/jnfs/storage

# --- 注册中心连接 ---
# DataNode 启动时向此地址注册，并定期发送心跳（携带剩余空间）。
registry:
  # 方式 1：单点配置（兼容旧版）
  # host: localhost
  # port: 5367

  # 方式 2：集群配置（推荐，支持逗号分隔的字符串或列表）
  addresses: localhost:5367

# --- 服务间安全配置（与 Registry/NameNode 必须保持一致）---
security:
  # 通信 Token
  token: "jnfs-secure-token-2025"
  # AES 加密密钥（32 字节 = 256 位），与 Registry/NameNode 完全一致即可
  aes-key: "jnfs-aes-key-256bit-secure-key!!"
