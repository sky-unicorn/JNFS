# Registry 注册中心配置
# 负责 DataNode/NameNode 的注册、心跳维护，以及向 NameNode 推送存储配置。
# 所有节点部署多份 Registry 时，security 段必须保持完全一致。

# --- RPC 服务 ---
server:
  port: 5367

# --- 统一存储配置 ---
# mode 同时决定两件事，避免存储模式与数据库连接信息在多处重复耦合：
#   - Dashboard 鉴权用户存储后端：h2=本地文件（FileUserStore），mysql=dashboard_user 表
#   - 冗余存储管理 API 是否启用：h2=单机无冗余，mysql=连元数据库读写冗余组/策略/任务表
storage:
  # 存储模式：h2 | mysql
  # h2    = 嵌入式 H2 文件库（单机零依赖，鉴权走本地文件，无冗余 API）
  # mysql = 连接 MySQL（鉴权与冗余 API 共享 DataSource，需配置下方 mysql 段）
  # 注：旧版本 file 模式已退役；若仍配 mode: file，启动时自动映射为 h2
  mode: h2

  # MySQL 连接（仅 mode: mysql 时生效）
  # dashboard_user 表与冗余元数据表（group/strategy/task）共用此连接与同一数据库
  mysql:
    host: 100.10.11.204
    port: 3306
    database: jnfs
    user: jnfs
    # 生产环境建议将 password 留空，通过环境变量 JNFS_REGISTRY_MYSQL_PASSWORD 提供
    password: jnfs@123

  # H2 文件库路径（仅 mode: h2 时生效）
  # Registry 自身不连 H2（由 NameNode 进程独享），此处 path 仅序列化进 storage payload，
  # 由 NameNode 拉取后定位 H2 文件。留空表示 NameNode 用 DataDirResolver 默认解析。
  h2:
    path: ""

# --- Dashboard Web 监控 ---
dashboard:
  # Web 监控页面端口（http://localhost:15367）
  port: 15367

  # 登录鉴权
  auth:
    # 是否启用登录鉴权；false 则跳过所有鉴权，保留旧的无登录行为
    enabled: true

    # 首次启动且存储中无用户时使用的初始管理员（创建后建议清空 password）
    # 密码也可用环境变量 JNFS_DASHBOARD_ADMIN_PASSWORD 提供（配置优先）
    initial-admin:
      username: admin
      # 留空则回退环境变量；两者均空则拒绝启动
      password: admin

    # Session 超时时间（秒），默认 2 小时
    session:
      timeout-seconds: 7200

# --- 心跳检测 ---
heartbeat:
  # 节点心跳超时时间（毫秒），超过此时间未收到心跳将自动剔除节点
  timeout_ms: 30000

# --- 服务间安全配置（与 NameNode/DataNode 必须保持一致）---
security:
  # 通信 Token
  token: "jnfs-secure-token-2025"
  # AES 加密密钥（32 字节 = 256 位），NameNode 用此密钥解密 Registry 推送的 storage 配置
  aes-key: "jnfs-aes-key-256bit-secure-key!!"
