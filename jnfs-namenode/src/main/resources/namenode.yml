# NameNode 元数据管理节点配置
# 负责文件元数据管理与 DataNode 调度，并通过 Registry 自动发现集群。

# --- RPC 服务 ---
server:
  port: 5368
  # 对外广播 IP 地址（默认自动获取本机 IP，多网卡/云服务器建议手动指定）
  advertised_host: 127.0.0.1
  # 节点唯一标识（不配置则自动生成 UUID 并持久化到 node_id.dat）
  # 生产环境建议手动指定，确保 IP 变更后节点身份不变
  # node_id: "nn-master-01"

# --- 注册中心连接 ---
# NameNode 启动时会将自身注册到此处，并定期拉取 DataNode 列表。
registry:
  # 方式 1：单点配置（兼容旧版）
  # host: localhost
  # port: 5367

  # 方式 2：集群配置（推荐，支持逗号分隔的字符串或列表）
  addresses: localhost:5367

# --- 存储配置 ---
# 存储模式（h2/mysql）与 MySQL 连接信息已统一到 registry.yml 的 storage 段，
# NameNode 启动时从 Registry 拉取（AES 加密传输），此处无需重复配置。
# 拉取失败或两端 security.aes-key 不一致时，NameNode 拒绝启动。

# --- 元数据内存缓存（NameNode 本地 JVM 调优，与存储模式无关）---
cache:
  # 是否开启内存缓存
  enabled: true
  # 缓存最大条目数（10w 条约占用 ~100MB 堆内存，按 JVM 容量调整）
  max-size: 100000

# --- 服务间安全配置（与 Registry/DataNode 必须保持一致）---
security:
  # 通信 Token
  token: "jnfs-secure-token-2025"
  # AES 加密密钥（32 字节 = 256 位），必须与 Registry 完全一致
  aes-key: "jnfs-aes-key-256bit-secure-key!!"
