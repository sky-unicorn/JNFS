# --- NameNode 服务配置 ---
server:
  # RPC 服务监听端口 (默认: 5368)
  port: 5368
  # 对外广播的 IP 地址 (默认: 自动获取本机局域网 IP)
  # 在多网卡环境或云服务器上，建议手动指定公网/内网 IP
  advertised_host: 127.0.0.1
  # 节点唯一标识 (可选，不配置则自动生成 UUID 并持久化到 node_id.dat)
  # 生产环境建议手动指定，确保 IP 变更后节点身份不变
  # node_id: "nn-master-01"

# --- 注册中心连接配置 ---
# NameNode 启动时会将自己注册到此地址，供客户端发现
registry:
  # 方式 1: 单点配置 (兼容旧版)
  # host: localhost
  # port: 5367

  # 方式 2: 集群配置 (推荐)
  # 支持逗号分隔的字符串或列表格式
  addresses: localhost:5367

# --- 存储配置说明 ---
# 存储模式（file/mysql）与 MySQL 连接配置已统一到 registry.yml 的 storage 段，
# NameNode 启动时从 Registry 拉取（AES 加密传输），此处无需重复配置。
# Registry 不可达或两端 security.aes-key 不一致时，NameNode 拒绝启动。

# --- 内存缓存配置 (NameNode 本地 JVM 调优，与存储模式无关) ---
cache:
  # 是否开启内存缓存 (默认: true)
  enabled: true
  # 缓存最大条目数 (默认: 100000)
  # 根据 JVM 内存大小调整: 10w 条约占用 100MB 堆内存
  max-size: 100000

# --- 安全配置 ---
security:
  # 通信令牌 (服务间鉴权密钥，所有节点必须一致)
  token: "jnfs-secure-token-2025"
  # AES 加密密钥 (必须为 16/24/32 字节，对应 128/192/256 位密钥)
  aes-key: "jnfs-aes-key-256bit-secure-key!!"
